[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
path_separator = os
# The URL comes from DATABASE_URL via alembic/env.py; never store credentials here.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
