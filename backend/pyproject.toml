[build-system]
requires = ["setuptools>=75,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-intel-backend"
version = "0.1.0"
description = "Evidence-based résumé intelligence API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "pypdf>=5.0,<7.0",
  "defusedxml>=0.7.1,<0.8",
  "prometheus-client>=0.20,<1.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
# Learned analysis and training. Without these the worker runs the rule-based reading.
ml = [
  "torch>=2.4,<3.0",
  "transformers>=4.44,<6.0",
  "safetensors>=0.4.3,<1.0",
]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]  # `..` makes the repository-level ml/ package importable
addopts = "-ra --strict-markers"
markers = [
  "integration: needs a disposable PostgreSQL database (TEST_DATABASE_URL)",
  "security: security regression tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# Ruff's formatter owns code wrapping; long prose, regexes and user messages stay readable.
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.File"]

# These libraries are optional: the baseline installation deliberately has no ML runtime.
[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "safetensors", "safetensors.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*"]
ignore_missing_imports = true

[tool.setuptools.package-data]
"app.lang" = ["taxonomy.json"]

"app.ml" = ["semantic-models.json"]
