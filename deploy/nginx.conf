# The only published listener. A TLS terminator on this host forwards here; for remote TLS
# termination configure set_real_ip_from with its EXACT address, never 0.0.0.0/0.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  access_log off; # Avoid URLs, address and recovery tokens in access logs.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=identity:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=10r/m;
  limit_req_status 429;
  server {
    listen 8080;
    client_max_body_size 5376k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 45s;
    proxy_request_buffering on;
    proxy_set_header Host $host;
    # Replace all supplied forwarding headers at the trusted boundary.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    error_page 413 = @too_large;
    error_page 429 = @limited;
    location @too_large {
      default_type application/json;
      return 413 '{"error":{"code":"payload_too_large","message":"The request body is too large.","details":{},"request_id":null}}';
    }
    location @limited {
      default_type application/json;
      add_header Retry-After 30 always;
      return 429 '{"error":{"code":"rate_limited","message":"Please wait and try again.","details":{},"request_id":null}}';
    }
    location ~ ^/api/v1/auth/(login|register|forgot-password|request-verification|reset-password|verify-email)$ {
      limit_req zone=identity burst=5 nodelay;
      proxy_pass http://api:8000;
    }
    location = /api/v1/guest/analyze {
      limit_req zone=uploads burst=3 nodelay;
      proxy_pass http://api:8000;
    }
    location /api/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://api:8000;
    }
    location / { proxy_pass http://web:3000; }
  }
}
