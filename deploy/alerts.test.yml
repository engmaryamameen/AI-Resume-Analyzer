rule_files: [alerts.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'up{job="resume-api"}'
        values: '0+0x10'
      - series: 'job_backlog_oldest_seconds{kind="run_analysis"}'
        values: '600+60x10'
      - series: 'job_last_progress_age_seconds'
        values: '600+60x10'
      - series: 'storage_free_bytes'
        values: '10+0x10'
      - series: 'storage_total_bytes'
        values: '100+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: ResumeApiUnavailable
        exp_alerts:
          - exp_labels: {job: resume-api, severity: critical}
            exp_annotations: {summary: "API or database scrape is unavailable", runbook: "docs/operations.md#database-outage"}
      - eval_time: 6m
        alertname: ResumeBacklogNotProgressing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "Jobs are waiting without worker progress", runbook: "docs/operations.md#worker-outage"}
      - eval_time: 6m
        alertname: ResumeStorageLow
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "Upload volume is below 15 percent free", runbook: "docs/operations.md#storage-exhaustion"}
